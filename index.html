<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Validade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2>🔐 Controle de Validade</h2>
            <p>Faça login para continuar</p>
            <input type="text" id="loginUsuario" placeholder="Usuário" autofocus>
            <input type="password" id="loginSenha" placeholder="Senha">
            <button id="loginBtn" class="btn-login">Entrar</button>
            <div id="loginErro" class="login-erro"></div>
        </div>
    </div>

    <!-- APP -->
    <div id="appContent" class="container" style="display:none;">

        <div class="topo-usuario">
            <span id="lojaAtual">🏬 Loja: —</span>
            <button id="logoutBtn" class="btn-logout">Sair</button>
        </div>

        <!-- SCANNER -->
        <div class="card scanner">
            <div class="card-header">
                <h2>🔍 CONTROLE VALIDADE</h2>
                <p>Escaneie o código de barras para consultar ou cadastrar</p>
            </div>

            <div class="card-body">
                <div class="campo-busca">
                    <label for="codigo">📷 Código de Barras (EAN):</label>
                    <input type="text" id="codigo" placeholder="Escaneie ou digite o código...">
                    <button id="buscarBtn" class="btn-buscar">🔍 Buscar</button>
                </div>

                <div id="loading" class="loading" style="display: none;">
                    ⏳ Buscando produto...
                </div>

                <div id="resultado" class="resultado">
                    <!-- Resultado aparece aqui -->
                </div>
            </div>
        </div>

        <!-- RELATÓRIO -->
        <div class="card relatorio">
            <div class="card-header">
                <h2>📊 RELATÓRIO MENSAL</h2>
                <p>Clique no botão abaixo para gerar o relatório com TODOS os produtos da loja</p>
            </div>

            <div class="card-body">
                <div class="botoes-relatorio">
                    <button id="gerarRelatorioBtn" class="btn-relatorio">📄 Gerar Relatório</button>
                    <button id="imprimirRemoverBtn" class="btn-imprimir-remover">🖨️ Imprimir e Remover Vencidos</button>
                </div>

                <div id="relatorio" class="relatorio">
                    <!-- Relatório aparece aqui -->
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
